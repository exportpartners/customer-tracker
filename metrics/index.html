<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#232F3E">
<title>EP Metrics</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
:root{--lac:#232F3E;--tur:#FF7D07;--zemin:#F5F6F8;--kart:#fff;--yazi:#1E1810;--soluk:#6B7280;--cizgi:#E6E8EC;--yes:#16A34A;--kir:#DC2626;--sari:#D97706}
*{box-sizing:border-box}
body{margin:0;background:var(--zemin);color:var(--yazi);font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;font-size:14px}
header{background:var(--lac);color:#fff;padding:14px 24px 0;position:sticky;top:0;z-index:5}
.ust{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:700}header h1 span{color:var(--tur)}
.alt{color:#C4CBD8;font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:#C4CBD8;font:inherit;font-weight:600;padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}
nav button.secili{background:var(--zemin);color:var(--lac)}
main{max-width:1320px;margin:0 auto;padding:18px 16px 40px}
.sekme{display:none}.sekme.acik{display:block}
h2{font-size:14px;margin:24px 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--lac);border-bottom:2px solid var(--tur);padding-bottom:6px}
.sekme>h2:first-child{margin-top:4px}
.izgara{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:12px;padding:14px 16px;min-width:0}
.kart h3{margin:0 0 10px;font-size:14px;color:var(--lac)}
.kart h4{margin:12px 0 6px;font-size:11px;color:var(--soluk);text-transform:uppercase;letter-spacing:.05em}
.kaynak{font-size:11px;color:var(--soluk);margin-top:8px}
.sayi{font-size:26px;font-weight:800;color:var(--lac)}
.etiket{font-size:12px;color:var(--soluk)}
.fark{font-size:12px;font-weight:700}
.yuk{color:var(--yes)}.dus{color:var(--kir)}.sabit{color:var(--soluk)}
.tablo{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--soluk);font-weight:600;border:0;border-bottom:1px solid var(--cizgi);padding:5px 4px;white-space:nowrap}
td{border:0;border-bottom:1px solid #F0F1F3;padding:6px 4px}
.r{text-align:right;white-space:nowrap}
[data-s]{cursor:pointer}
tr[data-s]:hover td{background:#FFF8F1}
.kart[data-s]:hover{border-color:var(--tur)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
.p-y{background:#DCFCE7;color:#166534}.p-k{background:#FEE2E2;color:#991B1B}.p-s{background:#FEF3C7;color:#92400E}.p-n{background:#E5E7EB;color:#374151}
.renk-y{color:var(--yes);font-weight:700}.renk-k{color:var(--kir);font-weight:700}.renk-s{color:var(--sari);font-weight:700}
.oneri{border-left:3px solid var(--tur);padding:8px 10px;margin:8px 0;background:#FFF8F1;border-radius:0 8px 8px 0;cursor:pointer}
.oneri:hover{background:#FFEFDF}
.oneri b{color:var(--lac)}.oneri .neden{font-size:12px;color:var(--soluk)}
.oneri code{font-size:11px;background:#fff;border:1px solid var(--cizgi);border-radius:4px;padding:0 4px;color:var(--lac)}
ol.is{margin:0;padding-left:18px}ol.is li{margin:5px 0}
.hata{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;padding:8px 12px;font-size:12px;margin:6px 0}
#perde{position:fixed;inset:0;background:rgba(15,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#perde.acik{display:flex}
#pencere{background:#fff;border-radius:14px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
#pencere h3{margin:0 0 4px;color:var(--lac);font-size:17px;padding-right:30px}
.kapat{float:right;background:none;border:0;font-size:24px;cursor:pointer;color:var(--soluk);line-height:1}
.araliklar{display:flex;gap:6px;margin:12px 0 6px;flex-wrap:wrap}
.araliklar button{border:1px solid var(--cizgi);background:#fff;border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--lac)}
.araliklar button.secili{background:var(--lac);color:#fff;border-color:var(--lac)}
.grafik svg{width:100%;height:auto;display:block}
.ozetsatir{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:13px}.ozetsatir b{color:var(--lac)}
#giris{position:fixed;inset:0;background:var(--lac);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#giris.acik{display:flex}
#giris .kutu{background:#fff;border-radius:14px;padding:24px;max-width:360px;width:100%}
#giris h2{border:0;margin:0 0 14px;text-transform:none;letter-spacing:0;font-size:20px}
#giris input{width:100%;padding:12px;border:1px solid var(--cizgi);border-radius:8px;font:inherit;margin-bottom:10px}
#giris button{width:100%;padding:12px;border:0;border-radius:999px;background:var(--tur);color:#fff;font:inherit;font-weight:700;cursor:pointer}
#girisHata{color:var(--kir);font-size:12px;min-height:16px;margin:0 0 8px}
#yukleniyor{text-align:center;padding:60px 16px;color:var(--soluk)}
@media (max-width:600px){header{padding:12px 16px 0}main{padding:12px 16px 30px}.sayi{font-size:22px}.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="ust">
    <div><h1>EP <span>Metrics</span></h1><div class="alt" id="uretim">Ölçüm ve strateji · satıra dokun, zaman çizgisi açılır</div></div>
    <button id="cikis" style="background:none;border:1px solid #4B5563;color:#C4CBD8;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer;display:none">Çıkış</button>
  </div>
  <nav id="sekmeler">
    <button data-t="yorum" class="secili">Yorum</button><button data-t="kelime">Kelimeler</button><button data-t="trafik">Trafik ve talep</button><button data-t="seo">SEO ve GEO</button>
    <button data-t="teknik">Teknik</button><button data-t="reklam">Reklam</button><button data-t="icerik">İçerik</button>
    <button data-t="hatlar">Hatlar</button><button data-t="oneri">Öneriler</button>
  </nav>
</header>
<main id="ana"><div id="yukleniyor">Veri yükleniyor…</div></main>
<div id="perde"><div id="pencere"></div></div>
<div id="giris"><div class="kutu"><h2>EP <span style="color:var(--tur)">Metrics</span></h2>
  <input type="email" id="gEmail" placeholder="E-posta" autocomplete="username">
  <input type="password" id="gSifre" placeholder="Şifre" autocomplete="current-password" onkeydown="if(event.key==='Enter')girisYap()">
  <p id="girisHata"></p><button onclick="girisYap()">Giriş yap</button>
  <p class="etiket" style="margin-top:12px">Tracker ile aynı giriş.</p></div></div>
<script>
var FIREBASE_CONFIG={apiKey:"AIzaSyAAk9RE2orcJek5J0YeAu0qvZWWlHzY5CA",authDomain:"export-partners-crm.firebaseapp.com",
  databaseURL:"https://export-partners-crm-default-rtdb.europe-west1.firebasedatabase.app",projectId:"export-partners-crm",appId:"1:1076654066112:web:1a2b1179ed9a2c59fe6025"};
var V=null, aktif=null;
function e(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sf(x,o){if(x==null||x==='')return '—';x=+x;var d=(o===undefined)?(Math.abs(x)<10&&x%1!==0?1:0):o;return x.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function ok(d,ters){if(d==null)return '<span class="sabit">—</span>';if(Math.abs(d)<0.05)return '<span class="sabit">• 0</span>';var iyi=ters?d<0:d>0;return '<span class="'+(iyi?'yuk':'dus')+'">'+(iyi?'▲':'▼')+' '+sf(Math.abs(d),1)+'</span>'}
function yuzde(a,b){if(!b)return '';var p=Math.round(100*(a-b)/b);return '<div class="fark '+(p>=0?'yuk':'dus')+'">'+(p>=0?'▲':'▼')+' %'+Math.abs(p)+' önceki döneme göre</div>'}
function kart(baslik,ic,kaynak){return '<div class="kart"><h3>'+baslik+'</h3>'+ic+(kaynak?'<div class="kaynak">'+kaynak+'</div>':'')+'</div>'}
function hataNotu(ad){return V.hatalar&&V.hatalar[ad]?'<div class="hata">'+e(ad)+': '+e(V.hatalar[ad])+'</div>':''}
function konumRenk(k){return k==null?'':(k<=3?'renk-y':(k<=10?'':(k<=20?'renk-s':'renk-k')))}
function kelimeTablo(l,bos){if(!l||!l.length)return '<div class="etiket">'+(bos||'Yok')+'</div>';
  return '<div class="tablo"><table><tr><th>Kelime</th><th class="r">Konum</th><th class="r">Hafta</th><th class="r">Ay</th><th class="r">Tık</th></tr>'+l.map(function(x){
  return '<tr data-s="'+x.s+'"><td>'+e(x.q)+'</td><td class="r '+konumRenk(x.konum)+'">'+sf(x.konum,1)+'</td><td class="r">'+ok(x.hafta)+'</td><td class="r">'+ok(x.ay)+'</td><td class="r">'+sf(x.tik)+'</td></tr>'}).join('')+'</table></div>'}

function ciz(){var a=V.kelime||{},t=V.trafik||{},s=V.seo||{},g=V.geo||{},tk=V.teknik||{},r=V.reklam||{},ic=V.icerik||{},o=V.oneri||{},H='';
 // YORUM
 H+='<section class="sekme" id="yorum"><h2>Yorum ve öneriler</h2>'+hataNotu('yorum')+'<div class="izgara g3">';
 (V.yorum||[]).forEach(function(x){H+='<div class="kart"'+(x.s?' data-s="'+x.s+'"':'')+'><h3>'+e(x.baslik)+(x.s?' <span class="etiket">· grafik</span>':'')+'</h3><ul style="margin:0;padding-left:18px">'+x.yorum.map(function(y){return '<li style="margin:4px 0">'+e(y)+'</li>'}).join('')+'</ul>'+(x.oneri&&x.oneri.length?'<h4>İyileştirme</h4>'+x.oneri.map(function(o){return '<div class="oneri" style="cursor:default"><div class="neden" style="color:#1E1810">'+e(o)+'</div></div>'}).join(''):'')+'</div>'});
 H+='</div><div class="kaynak">Yorumlar her sabah verinin kendisinden kurala göre yazılır; sayı uydurulmaz.</div></section>';
 // KELIMELER
 H+='<section class="sekme" id="kelime"><h2>Kelimeler</h2>'+hataNotu('gsc')+'<div class="izgara g3">';
 H+=kart('Organikte önde olduğumuz kelimeler (ilk 10)',kelimeTablo(a.onde,'İlk 10\'da ticari kelime yok')+
   (a.yeni&&a.yeni.length?'<h4>Yeni giren</h4>'+a.yeni.map(function(x){return '<span class="pill p-y" data-s="'+x.s+'">'+e(x.q)+' ('+sf(x.konum,1)+')</span> '}).join(''):'')+
   (a.dusen&&a.dusen.length?'<h4>İlk 10\'dan düşen</h4>'+a.dusen.map(function(x){return '<span class="pill p-k" data-s="'+x.s+'">'+e(x.q)+' ('+sf(x.konum,1)+')</span> '}).join(''):''),
   'Search Console, son veri günü '+e(a.son)+' · hafta: son 7 gün / önceki 7 gün · ay: son 28 / önceki 28 gün · ▲ yükseldi');
 H+=kart('Yapay zekâda önde olduğumuz sorgular',(g.satirlar?'<div class="tablo"><table><tr><th>Sorgu</th><th class="r">Sıra</th><th class="r">Hafta</th><th class="r">Ay</th></tr>'+g.satirlar.map(function(x){
   return '<tr data-s="'+x.s+'"><td>'+e(x.q)+'</td><td class="r '+(x.sira?(x.sira<=3?'renk-y':''):'renk-k')+'">'+(x.sira||'yok')+'</td><td class="r">'+ok(x.hafta)+'</td><td class="r">'+ok(x.ay)+'</td></tr>'}).join('')+'</table></div>'+
   '<div class="etiket" style="margin-top:8px" data-s="ai-bulunan">'+g.toplam+' sorgunun <b>'+g.bulunan+'</b> tanesinde ilk 10\'dayız'+(g.onceki!=null?' (önceki ölçüm '+g.onceki+')':'')+'</div>':hataNotu('geo')),
   'Perplexity, 10 ticari sorgu · ölçüm '+e(g.olcum)+' · haftada bir (Pazartesi)');
 var h=a.hedef||{};
 H+=kart('Hedef kelimeler (sabit sepet)','<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px">'+
   ['1-10','11-20','21+'].map(function(b){return '<div><div class="sayi">'+((h.bant||{})[b]||0)+'</div><div class="etiket">'+(b=='1-10'?'ilk sayfada':b+' arası')+'</div></div>'}).join('')+
   '<div><div class="sayi">'+(h.gorunmuyor||0)+'</div><div class="etiket">görünmüyor</div></div></div>'+
   Object.keys(h.sepetler||{}).map(function(k){var x=h.sepetler[k];return '<div class="oneri" data-s="'+x.s+'" style="cursor:pointer"><b>'+e(k)+' sepeti</b> · ortalama konum '+sf(x.son,1)+'<div class="neden">Dokun: 16 aylık çizgi</div></div>'}).join('')+
   kelimeTablo((h.satirlar||[]).filter(function(x){return x.konum}).slice(0,15)),'kelime-izle.py sepetleri: Amazon 25 + FDA 17 · hedef ilk sayfa');
 H+='</div></section>';
 // TRAFIK
 H+='<section class="sekme" id="trafik"><h2>Trafik ve talep</h2>'+hataNotu('ga4')+hataNotu('talep')+'<div class="izgara g4">';
 var gs=(V.gsc_ozet||{});
 H+='<div class="kart" data-s="gsc-tik"><div class="etiket">Organik tıklama (28 gün)</div><div class="sayi">'+sf(gs.tik28)+'</div>'+yuzde(gs.tik28,gs.tik28_gy).replace('önceki döneme','geçen yıla')+'</div>';
 H+='<div class="kart" data-s="gsc-gosterim"><div class="etiket">Organik gösterim (28 gün)</div><div class="sayi">'+sf(gs.gos28)+'</div>'+yuzde(gs.gos28,gs.gos28_gy).replace('önceki döneme','geçen yıla')+'</div>';
 H+='<div class="kart" data-s="ga-oturum"><div class="etiket">GA4 oturum (28 gün)</div><div class="sayi">'+sf(t.oturum28)+'</div>'+yuzde(t.oturum28,t.oturum28_once)+'</div>';
 H+='<div class="kart" data-s="talep-gunluk"><div class="etiket">Gelen talep (28 gün)</div><div class="sayi">'+sf(t.talep28_tracker)+'</div><div class="etiket">tracker ve form kayıtları</div></div>';
 H+='<div class="kart" data-s="ga-talep"><div class="etiket">Form talebi GA4 (28 gün)</div><div class="sayi">'+sf(t.talep28)+'</div>'+yuzde(t.talep28,t.talep28_once)+'</div>';
 H+='</div><div class="izgara g3" style="margin-top:14px">';
 H+=kart('Talebin kaynağı (28 gün)','<table><tr><th>Kaynak</th><th class="r">Talep</th></tr>'+(t.talep_kaynak||[]).map(function(x){return '<tr><td>'+e(x.kaynak)+'</td><td class="r">'+x.adet+'</td></tr>'}).join('')+'</table>','Tracker + tracker dışı talepler · cold email ve iş ortağı hariç');
 H+=kart('Oturumu en çok artan ve düşen sayfalar','<div class="tablo"><table><tr><th>Sayfa</th><th class="r">28 gün</th><th class="r">Fark</th></tr>'+(t.sayfalar||[]).map(function(x){return '<tr data-s="'+x.s+'"><td>'+e(x.sayfa)+'</td><td class="r">'+x.simdi+'</td><td class="r">'+ok(x.fark)+'</td></tr>'}).join('')+'</table></div>','GA4 · son 28 gün / önceki 28 gün · İngilizce sayfalar hariç');
 H+=kart('Talep getiren sayfalar (28 gün)','<div class="tablo"><table><tr><th>Sayfa</th><th class="r">Talep</th></tr>'+(t.talep_sayfa||[]).map(function(x){return '<tr><td>'+e(x.sayfa)+'</td><td class="r">'+x.adet+'</td></tr>'}).join('')+'</table></div>','GA4 generate_lead, sayfa bazında');
 H+='</div></section>';
 // SEO GEO
 H+='<section class="sekme" id="seo"><h2>SEO</h2>'+hataNotu('dizin')+'<div class="izgara g3">';

 H+=kart('Fırsat: konum 5-15, tıklama düşük',kelimeTablo(s.firsat,'Bu hafta fırsat yok'),'Başlık ve meta adayı · aynı sayfaya 30 günde bir dokunulur');
 var dz=s.dizin||{};
 H+='<div class="kart" data-s="'+(dz.s||'')+'"><h3>Dizin</h3><div style="display:flex;gap:18px"><div><div class="sayi">'+(dz.toplam?Math.round(100*dz.dizinde/dz.toplam):'—')+'%</div><div class="etiket">dizinde</div></div><div><div class="sayi">'+((dz.toplam||0)-(dz.dizinde||0))+'</div><div class="etiket">dizinde değil</div></div></div><div class="kaynak">URL Inspection API · ölçüm '+e(dz.tarih)+'</div></div>';
 H+='</div><h2>GEO (yapay zekâ görünürlüğü)</h2>'+hataNotu('geo')+'<div class="izgara g4">';
 H+='<div class="kart" data-s="ai-bulunan"><div class="etiket">Perplexity\'de ilk 10\'da olduğumuz sorgu</div><div class="sayi">'+(g.bulunan!=null?g.bulunan+' / '+g.toplam:'—')+'</div></div>';
 H+='<div class="kart"><div class="etiket">Yapay zekâ okumasında kapsam dışı ifade</div><div class="sayi">'+(g.kapsam_disi!=null?g.kapsam_disi:'—')+'</div><div class="etiket">ölçüm '+e(g.ai_okuma_tarih)+'</div></div>';
 H+='</div></section>';
 // TEKNIK
 H+='<section class="sekme" id="teknik"><h2>Teknik sağlık</h2>'+hataNotu('teknik')+'<div class="izgara g3">';

 var cr=tk.crux||{};
 H+=kart('Gerçek kullanıcı (CrUX, p75)','<div class="izgara g4" style="gap:10px">'+Object.keys(cr).map(function(k){var x=cr[k],v=x.deger,b=k=='LCP'?(v<=2.5?'p-y':v<=4?'p-s':'p-k'):k=='INP'?(v<=200?'p-y':v<=500?'p-s':'p-k'):k=='CLS'?(v<=0.1?'p-y':v<=0.25?'p-s':'p-k'):(v<=0.8?'p-y':v<=1.8?'p-s':'p-k');
   return '<div data-s="'+x.s+'"><div class="etiket">'+k+'</div><div class="sayi" style="font-size:20px">'+sf(v,k=='CLS'?2:(k=='INP'?0:1))+' '+x.birim+'</div><span class="pill '+b+'">'+(b=='p-y'?'iyi':b=='p-s'?'orta':'kötü')+'</span></div>'}).join('')+'</div>','Chrome UX Report, site geneli, haftalık 28 günlük pencere');
 H+='</div></section>';
 // REKLAM
 H+='<section class="sekme" id="reklam"><h2>Reklam (Google Ads, 14 gün)</h2>'+hataNotu('reklam')+'<div class="izgara g4">';
 H+='<div class="kart" data-s="ads-harcama"><div class="etiket">Harcama</div><div class="sayi">'+sf(r.harcama14)+' TL</div>'+yuzde(r.harcama14,r.harcama14_once)+'</div>';
 H+='<div class="kart" data-s="ads-tik"><div class="etiket">Tıklama</div><div class="sayi">'+sf(r.tik14)+'</div>'+yuzde(r.tik14,r.tik14_once)+'</div>';

function noktalar(sr){var out=[];if(sr.tarihler){for(var i=0;i<sr.v.length;i++)out.push([new Date(sr.tarihler[i]+'T12:00:00'),sr.v[i]])}else{var d=new Date(sr.bas+'T12:00:00');for(var j=0;j<sr.v.length;j++){out.push([new Date(d.getTime()+j*864e5),sr.v[j]])}}return out}
function fmt(d){return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'2-digit'})}
function grafikAc(k){var sr=V.seriler&&V.seriler[k];if(!sr)return;aktif=sr;grafikCiz(12)}
function grafikCiz(ay){var sr=aktif,tum=noktalar(sr),son=tum.length?tum[tum.length-1][0]:new Date(),sinir=ay?new Date(son.getTime()-ay*30.4*864e5):null;
 var s=tum.filter(function(p){return (!sinir||p[0]>=sinir)});var dolu=s.filter(function(p){return p[1]!=null});
 var btn=[[1,'1 ay'],[3,'3 ay'],[6,'6 ay'],[12,'12 ay'],[0,'Tümü']].map(function(b){return '<button '+(b[0]===ay?'class="secili"':'')+' onclick="grafikCiz('+b[0]+')">'+b[1]+'</button>'}).join('');
 var bas='<button class="kapat" onclick="kapat()">×</button><h3>'+e(sr.ad)+'</h3><div class="etiket">Veri '+(tum.length?fmt(tum[0][0]):'—')+' tarihinden beri'+(sr.ters?' · düşük değer daha iyi, eksen ters':'')+'</div><div class="araliklar">'+btn+'</div>';
 if(dolu.length<2){goster(bas+'<div class="etiket" style="padding:30px 0">Bu aralıkta çizgi için yeterli veri yok ('+dolu.length+' nokta). Ölçüm her gün birikiyor.</div>');return}
 var W=720,Hh=290,L=52,R=16,T=16,B=34,t0=s[0][0].getTime(),t1=s[s.length-1][0].getTime()||t0+1,vs=dolu.map(function(p){return p[1]}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);
 if(mx==mn){mx+=1;mn-=1}var pay=(mx-mn)*.1;mn-=pay;mx+=pay;if(mn<0&&Math.min.apply(null,vs)>=0)mn=0;
 function x(t){return L+(W-L-R)*(t-t0)/((t1-t0)||1)}function y(v){var o=(v-mn)/(mx-mn);if(sr.ters)o=1-o;return T+(Hh-T-B)*(1-o)}
 var yol='',bas2=true;s.forEach(function(p){if(p[1]==null){bas2=true;return}yol+=(bas2?'M':'L')+x(p[0].getTime()).toFixed(1)+','+y(p[1]).toFixed(1);bas2=false});
 var izg='';for(var k=0;k<=4;k++){var vv=mn+(mx-mn)*k/4,yy=y(vv);izg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="#EEF0F3"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#6B7280">'+sf(vv,Math.abs(mx)<10?1:0)+'</text>'}
 var son1=dolu[dolu.length-1],ilk=dolu[0];
 var etk='<text x="'+L+'" y="'+(Hh-10)+'" font-size="11" fill="#6B7280">'+fmt(s[0][0])+'</text><text x="'+((L+W-R)/2)+'" y="'+(Hh-10)+'" font-size="11" fill="#6B7280" text-anchor="middle">'+fmt(new Date((t0+t1)/2))+'</text><text x="'+(W-R)+'" y="'+(Hh-10)+'" font-size="11" fill="#6B7280" text-anchor="end">'+fmt(s[s.length-1][0])+'</text>';
 var nok=dolu.length<40?dolu.map(function(p){return '<circle cx="'+x(p[0].getTime())+'" cy="'+y(p[1])+'" r="3" fill="#FF7D07"/>'}).join(''):'';
 var svg='<svg viewBox="0 0 '+W+' '+Hh+'">'+izg+'<path d="'+yol+'" fill="none" stroke="#FF7D07" stroke-width="2.2" stroke-linejoin="round"/>'+nok+'<circle cx="'+x(son1[0].getTime())+'" cy="'+y(son1[1])+'" r="4" fill="#232F3E"/>'+etk+'</svg>';
 var fark=son1[1]-ilk[1],iyi=sr.ters?fark<0:fark>0,en=sr.ters?Math.min.apply(null,vs):Math.max.apply(null,vs);
 goster(bas+'<div class="grafik">'+svg+'</div><div class="ozetsatir"><span>Başta: <b>'+sf(ilk[1],1)+' '+e(sr.birim)+'</b></span><span>Şimdi: <b>'+sf(son1[1],1)+' '+e(sr.birim)+'</b></span><span class="'+(Math.abs(fark)<1e-9?'sabit':(iyi?'yuk':'dus'))+'"><b>'+(Math.abs(fark)<1e-9?'•':(iyi?'▲':'▼'))+' '+sf(Math.abs(fark),1)+'</b></span><span>En iyi: <b>'+sf(en,1)+'</b></span></div>')}
